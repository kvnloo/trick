# Fork-only validation; generated by ChatGPT. Not intended for an upstream PR.
name: Comparison retry probe 2216

on:
  push:
    branches:
      - probe/trickops-comparison-2216
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: comparison-retry-probe-2216
  cancel-in-progress: true

jobs:
  regression:
    if: github.repository == 'kvnloo/trick'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out fork probe
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install existing TrickOps dependencies
        run: |
          python3 -m venv .probe-venv
          . .probe-venv/bin/activate
          python -m pip install -r share/trick/trickops/requirements.txt
          python --version
          python -m pip freeze
      - name: Verify upstream failures and candidate recovery
        run: |
          . .probe-venv/bin/activate
          python tools/probes/trickops_comparison_2216.py
      - name: Upload exact test logs and generated production patch
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: comparison-retry-2216-evidence
          path: probe-results/
          if-no-files-found: warn
          retention-days: 14
