# Fork-only validation and packaging, generated by ChatGPT. Not for upstream.
name: Comparison retry probe 2216

on:
  push:
    branches:
      - probe/trickops-comparison-2216
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: comparison-retry-probe-2216
  cancel-in-progress: true

jobs:
  regression:
    if: github.repository == 'kvnloo/trick'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - name: Check out fork packaging tools
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Install existing TrickOps dependencies
        run: |
          python3 -m venv .probe-venv
          . .probe-venv/bin/activate
          python -m pip install -r share/trick/trickops/requirements.txt
          python --version
          python -m pip freeze
      - name: Test registered regressions and publish only the clean fix branch
        run: |
          . .probe-venv/bin/activate
          python tools/probes/package_comparison_2216.py
      - name: Upload exact test logs and the two-file patch
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: comparison-retry-2216-pr-evidence
          path: probe-results/
          if-no-files-found: warn
          retention-days: 14
